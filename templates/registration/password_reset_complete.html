{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset Complete — EventHub Campus{% endblock %}

{% block content %}
<div class="auth-stage">
  <div class="auth-panel text-center">
    <div class="mb-4">
      <a href="{% url 'event_list' %}">
        <img src="{% static 'images/logo.png' %}" alt="EventHub Campus Edition" style="height: 58px; max-width: 100%; object-fit: contain;">
      </a>
    </div>

    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 72px; height: 72px; background: #ECFDF5; border: 2px solid #A7F3D0;">
      <i class="fa fa-check text-success fs-2"></i>
    </div>

    <h2 class="auth-panel-heading mb-2">Password updated!</h2>
    <p class="auth-panel-sub mb-4">
      Your password has been changed successfully. You can now sign in using your new credentials.
    </p>

    <a href="{% url 'login' %}" class="btn-primary-dark w-100 justify-content-center text-decoration-none py-2">
      <i class="fa fa-sign-in-alt me-2"></i> Sign in to EventHub
    </a>
  </div>
</div>
{% endblock %}
